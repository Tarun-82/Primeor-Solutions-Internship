<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1 class="text-center my-4">Image Gallery</h1>

    <!-- Auto Slideshow -->
    <div class="container mb-5">

        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1015/900/400" class="d-block w-100 slider-img">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1025/900/400" class="d-block w-100 slider-img">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1035/900/400" class="d-block w-100 slider-img">
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <!-- Main Preview Image -->
    <div class="container text-center">

        <img
            id="mainImage"
            src="https://picsum.photos/id/1015/900/500"
            class="img-fluid main-image"
            alt=""
        >

    </div>

    <!-- Thumbnail Gallery -->
    <div class="container mt-4">

        <div class="row g-3 gallery">

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1015/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1025/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1035/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1045/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1055/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

            <div class="col-6 col-md-4 col-lg-2">
                <img
                    src="https://picsum.photos/id/1065/300/200"
                    class="img-fluid thumb"
                    onclick="changeImage(this.src)"
                >
            </div>

        </div>

    </div>

    <script src="index.css"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
